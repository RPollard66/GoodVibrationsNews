<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Good Vibrations News</title>
    <meta name="theme-color" content="#0b1221" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <main class="app-shell">
      <header class="hero">
        <div class="hero-topline">
          <p class="eyebrow">Tech, Science, and Gaming</p>
        </div>
        <h1>Good Vibrations News</h1>
        <p class="subtitle">
          AI-first headlines across world, science, android, and gaming RSS feeds.
        </p>
      </header>

      <section id="newsView" class="app-view">
        <section class="filters" aria-label="Category filters">
          <button class="filter-chip active" data-filter="all">All</button>
          <button class="filter-chip" data-filter="ai">AI</button>
          <button class="filter-chip" data-filter="android">Android</button>
          <button class="filter-chip" data-filter="maker">Maker/Electronics</button>
          <button class="filter-chip" data-filter="science">Science</button>
          <button class="filter-chip" data-filter="gaming">Gaming</button>
          <button class="filter-chip" data-filter="general">General</button>
        </section>

        <section>
          <h2 class="section-title">Top Stories</h2>
          <div id="statusLine" class="status-line">Fetching stories...</div>
          <div id="articles" class="card-grid"></div>
        </section>
      </section>
    </main>

    <template id="articleTemplate">
      <article class="story-card">
        <div class="story-topline">
          <span class="pill category"></span>
          <span class="pill source"></span>
        </div>
        <h3 class="story-title"></h3>
        <p class="story-snippet"></p>
        <button class="expand-btn" type="button" hidden>Expand</button>
        <div class="story-meta">
          <span class="story-date"></span>
          <a class="story-link" target="_blank" rel="noopener noreferrer">Read story</a>
        </div>
      </article>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
